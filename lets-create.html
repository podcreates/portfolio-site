    /* Prevent flash of un-split text */
[data-words] {
  visibility: hidden; /* keeps layout space, hides text */
}

[data-words].words-ready {
  visibility: visible;
}

/* ===============================
   Cinematic Word-by-Word Animation
   =============================== */

/* Smooth upward reveal */
@keyframes wordUp {
  0% {
    opacity: 0;
    transform: translateY(20px);
  }
  60% {
    opacity: 1;
    transform: translateY(0);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Word styling + cinematic timing */
.word-anim .w {
  display: inline-block;
  opacity: 0;

  /* Faster animation */
   animation: wordUp 1600ms cubic-bezier(.16, 1, .3, 1) forwards;

  /* Less initial pause + tighter stagger */
 animation-delay: calc(300ms + (var(--i) * 250ms));

  will-change: transform, opacity;
}

/* If a word ALSO has animated-gradient, run BOTH animations */
.word-anim .w.animated-gradient{
  animation:
    wordUp 1600ms cubic-bezier(.16, 1, .3, 1) forwards,
    gradientFlow 9s ease-in-out infinite;

  animation-delay:
    calc(300ms + (var(--i) * 250ms)),
    0ms;
}

/* Accessibility — disable motion if user prefers reduced motion */
@media (prefers-reduced-motion: reduce) {
  .sub-reveal {
    opacity: 1;
    transform: none;
    animation: none;
  }
}

/* Paragraph reveal (after headline finishes) */
.sub-reveal {
  opacity: 0;
  transform: translateY(16px);
}

.sub-reveal.reveal-ready {
  animation: subFadeUp 2000ms cubic-bezier(.16, 1, .3, 1) forwards;
}

@keyframes subFadeUp {
  0% {
    opacity: 0;
    transform: translateY(16px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

    .btn-glow::after{
      content:"";

      inset:0;
      border-radius: inherit;
      pointer-events:none;
      z-index:0;
      box-shadow: 0 0 0 1px rgba(255,255,255,.10) inset;
      opacity: 0;
      transition: opacity .16s ease;

  <script>
  // =========================
  // ✅ Magnetic Micro-interactions
  // =========================
  (() => {
    const threshold = 40;
    const power = 0.04;
    document.addEventListener("pointermove", (e) => {
      const items = document.querySelectorAll(".btn-glow:not(.no-magnetic)");
      items.forEach(el => {
        const r = el.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < threshold) {
          const moveX = dx * power;
          const moveY = dy * power;
          el.style.transform = `translate3d(${moveX}px, ${moveY}px, 0) scale(1.002)`;
        } else {
          el.style.transform = "";
        }
      });
    }, { passive: true });
  })();

  // delegated glow listener
  (() => {
    let activeEl = null;
    let raf = 0;
    let lastEvent = null;

    function update() {
      raf = 0;
      if (!activeEl || !lastEvent) return;
      const r = activeEl.getBoundingClientRect();
      const x = ((lastEvent.clientX - r.left) / r.width) * 100;
      const y = ((lastEvent.clientY - r.top) / r.height) * 100;
      activeEl.style.setProperty("--mx", x + "%");
      activeEl.style.setProperty("--my", y + "%");
    }

    document.addEventListener("pointerover", (e) => {
      const el = e.target.closest?.(".btn-glow");
      if (!el) return;
      activeEl = el;
    }, { passive: true });

    document.addEventListener("pointerout", (e) => {
      const el = e.target.closest?.(".btn-glow");
      if (!el) return;
      if (activeEl === el) {
        el.style.setProperty("--mx", "50%");
        el.style.setProperty("--my", "50%");
        activeEl = null;
        lastEvent = null;
      }
    }, { passive: true });

    document.addEventListener("pointermove", (e) => {
      if (!activeEl) return;
      // Skip glow updates when disabled (e.g., submit button)
      if (activeEl.matches?.(":disabled") || activeEl.getAttribute("aria-disabled") === "true") return;

      lastEvent = e;
      if (!raf) raf = requestAnimationFrame(update);
    }, { passive: true });
  })();

  // formspree AJAX submit
  (() => {
    const form = document.getElementById("letsCreateForm");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    if (!form || !statusEl || !submitBtn) return;

    // Clear status as user edits the form again
    form.addEventListener("input", () => {
      if (statusEl.textContent) statusEl.textContent = "";
    }, { passive: true });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const hp = form.querySelector('input[name="website"]');
      if (hp && hp.value) return;

      submitBtn.disabled = true;
      statusEl.textContent = "Sending…";

      try {
        const res = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { "Accept": "application/json" },
        });

        if (res.ok) {
          form.reset();
          statusEl.textContent = "✅ Sent! I’ll reply soon.";
        } else {
          statusEl.textContent = "❌ Something went wrong. Try again or email me directly.";
        }
      } catch {
        statusEl.textContent = "❌ Network error. Try again.";
      } finally {
        submitBtn.disabled = false;
      }
    });
  })();

  // word-by-word headline reveal + slightly-earlier paragraph reveal
  (() => {
    function splitIntoWords(rootEl) {
      let i = 0;

      function process(node, inheritedClasses = []) {
        // Text node → split into words (keeping spaces)
        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.nodeValue || "";
          const parts = text.split(/(\s+)/);
          const frag = document.createDocumentFragment();

          for (const part of parts) {
            if (!part) continue;

            if (/^\s+$/.test(part)) {
              frag.appendChild(document.createTextNode(part));
            } else {
              const span = document.createElement("span");
              span.className = ["w", ...inheritedClasses].join(" ").trim();
              span.style.setProperty("--i", i++);
              span.textContent = part;
              frag.appendChild(span);
            }
          }
          return frag;
        }

        // Element node → recurse into children, carrying classes (keeps gradient styles)
        if (node.nodeType === Node.ELEMENT_NODE) {
          const el = node;
          const nextClasses = [...inheritedClasses, ...Array.from(el.classList)];
          const frag = document.createDocumentFragment();

          for (const child of Array.from(el.childNodes)) {
            frag.appendChild(process(child, nextClasses));
          }
          return frag;
        }

        return document.createDocumentFragment();
      }

      const rebuilt = process(rootEl, []);
      rootEl.innerHTML = "";
      rootEl.appendChild(rebuilt);

      // Prevent flash: show only after split is complete
      rootEl.classList.add("words-ready");

      // Reveal paragraph a bit before the headline fully finishes
      const words = rootEl.querySelectorAll(".w");
      const sub = document.getElementById("subText");

      if (!sub) return;

      const revealSub = () => sub.classList.add("reveal-ready");

      if (words.length === 0) {
        revealSub();
        return;
      }

      // Timing must match your CSS:
      // animation-delay: calc(300ms + (var(--i) * 250ms));
      // animation-duration: 1600ms
      const initialDelay = 300;
      const stagger = 250;
      const duration = 1600;

      // Reveal paragraph ONLY after the last word "Ideas" has arrived.
      const lastWordStart = initialDelay + (words.length - 1) * stagger;
      const totalMs = lastWordStart + (duration * 0.15); 

      setTimeout(revealSub, totalMs);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const headline = document.querySelector("[data-words]");
      if (headline) splitIntoWords(headline);
    });
  })();

  // ✅ Reveal Observer for form
  (() => {
    const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -50px 0px' };
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('reveal-in');
          observer.unobserve(entry.target);
        }
      });
    }, observerOptions);

    document.querySelectorAll('.reveal-inner').forEach(el => observer.observe(el));
  })();
</script>
</main>
</body>
