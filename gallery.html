  <style>

    #grid { overflow: visible; padding: 2px; }

    html { overflow-y: scroll; scrollbar-gutter: stable; }
    body { padding-right: var(--sbw, 0px); cursor: default; }
    #siteHeader { padding-right: var(--sbw, 0px); }

    /* Prevent page jump when filtering (scroll anchoring) */
    html, body { overflow-anchor: none; }
    #filtersWrap, #grid, #grid * { overflow-anchor: none; }

    body { font-weight: 500; }
    html, body {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial !important;
    }

    :root {
      --thumb-radius: 24px;
    }
    body{
      background: #07070b;
      overflow-x: hidden;
      position: relative;
      color: #f4f4f5;
    }
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .10;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 2px, transparent 4px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 2px, transparent 4px);
    }

    /* btn-glow (same behavior as index) */
    .btn-glow{
      --mx: 50%;
      --my: 50%;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      transform: translateZ(0);
    }
    .btn-glow::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius: inherit;
      pointer-events:none;
      z-index: 0;
      background:
        radial-gradient(120px 80px at var(--mx) var(--my),
          rgba(203, 184, 255, 0.075),
          rgba(56, 8, 228, 0.032) 45%,
          transparent 72%);
      opacity: 0;
      transition: opacity .16s ease;
    }
    .btn-glow::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius: inherit;
      pointer-events:none;
      z-index:0;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.10) inset,
        0 14px 50px rgba(56,8,228,.12);
      opacity: 0;
      transition: opacity .16s ease;
    }
    .btn-glow:hover::before,
    .btn-glow:hover::after{ opacity: 1; }
    .btn-glow > *{ position: relative; z-index: 1; }

    .lets-create-edge{
      border: 1.5px solid rgba(56,8,228,.85) !important;
      box-shadow: 0 0 0 1px rgba(56,8,228,.55), 0 8px 28px rgba(56,8,228,.18);
      transition: all .25s ease;
    }
    .lets-create-edge:hover{
      box-shadow: 0 0 0 1px rgba(56,8,228,.8), 0 0 18px rgba(56,8,228,.35), 0 14px 45px rgba(56,8,228,.22);
    }

    /* Filter indicator + pills */
    #filtersWrap {
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none;  /* IE and Edge */
    }
    #filtersWrap::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }
    .filterBtn { border: 1px solid transparent; }
    .filterBtn.text-white {
      border: 1px solid #3808E4;
      box-shadow: none;
    }

      box-shadow: 0 0 0 1px rgba(56,8,228,.55) inset, 0 14px 50px rgba(56,8,228,.12);
    }

        rgba(56,8,228,.10) 45%,

      box-shadow: none;

    /* Gallery grid (same breakpoints as index) */

    @media (max-width: 640px){ .grid-auto { grid-template-columns: 1fr; } }

    /* allow hover transforms/shadows to render fully */
    #grid { overflow: visible; }
    #grid button { contain: layout; }

    /* make hovered card render above neighbors */
    .thumb-card { position: relative; }
    .thumb-card:hover { z-index: 20; }

    /* Thumbnails — EXACT old hover feel */
.thumb-card{
  position: relative;
  overflow: hidden;
  border-radius: var(--thumb-radius);
  background: transparent;
  text-align: left;

  transform: translateZ(0);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transition: transform 300ms ease-out, border-color 300ms ease-out, box-shadow 850ms cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform, opacity, box-shadow;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 0 0 rgba(0,0,0,0);
}

.reveal-in .thumb-card {
  box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
}

.thumb-card:hover{
  transform: translateY(-4px) scale(1.035);
}

.thumb-card:active{
  transform: translateY(-2px) scale(0.98);
  transition: transform 0.1s ease;
}

/* Image — match old (no hover zoom) */
.thumb-img{
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: transparent;
  transform: none;
  opacity: 0;
  
  /* Simplified to pure fade to let reveal-inner handle the "flight" */
  transition: opacity 700ms cubic-bezier(0.25, 1, 0.5, 1);
  will-change: opacity;
}

.thumb-img.is-loaded {
  opacity: 1;
}

/* Overlay — match old (opacity 0 -> 1, 300ms) */
.thumb-overlay{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition: opacity 300ms;
  background: linear-gradient(to top,
    rgba(0,0,0,.70),
    rgba(0,0,0,0) 60%
  );
}

.thumb-card:hover .thumb-overlay{ opacity: 0.7; }

/* Hide original during lightbox to prevent "4 corners" ghosting */
.thumb-card.is-opening {
  opacity: 0 !important;
  pointer-events: none;
}

    .thumb-pill{
      position:absolute;
      right: 12px;
      bottom: 12px;
      font-size: 11px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 10px;
      color: rgba(244, 244, 245, 0.963);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.297);
      pointer-events: none;

      opacity: 0;
      transform: translateY(8px);
      transition: 
        opacity 1000ms cubic-bezier(0.25, 1, 0.5, 1),
        transform 1000ms cubic-bezier(0.25, 1, 0.5, 1);
      transition-delay: 150ms;
    }

    /* Sync pill with image load + add assembly lift */
    .thumb-img.is-loaded ~ .thumb-pill {
      opacity: 1;
      transform: translateY(0);
    }

    /* ✅ Freeze card hover transforms during FLIP so start rect doesn't move */
.thumb-card.is-opening,
.thumb-card.is-opening:hover{
  transform: none !important;
}

.thumb-card.is-opening .thumb-img,
.thumb-card.is-opening:hover .thumb-img{
  transform: none !important;
}

    /* =========================
       Scroll Reveal (same as index)
       ========================= */
    .reveal-inner{
      opacity: 0;
      /* Atmospheric "flying in" start state */
      transform: translateY(var(--reveal-y, 40px)) scale(var(--reveal-s, 0.97));
      filter: blur(5px);
      transition:
        opacity 850ms cubic-bezier(.16,1,.3,1),
        transform 850ms cubic-bezier(.16,1,.3,1),
        filter 850ms cubic-bezier(.16,1,.3,1);
      transition-delay: var(--reveal-delay, 0ms);
      will-change: transform, opacity, filter;
    }
    .reveal-in{
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
    @media (prefers-reduced-motion: reduce){
      .reveal-inner{ transition: none; opacity: 1; transform: none; }
    }

    /* Remove blur ONLY for thumbnails */
    .no-blur { filter: none !important; }
    .no-blur.reveal-in { filter: none !important; }

    /* =========================
       ✅ LIGHTBOX + FLY (matches index)
       ========================= */
    #lightbox{
      position: fixed;
      inset: 0;
      z-index: 9999;

      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
      will-change: opacity;

      isolation: isolate;
    }

    /* Show state */
    #lightbox.show{
      opacity: 1;
      pointer-events: auto;
    }

    /* Overlay base */
    #lightbox::before{
      content:"";
      position:absolute;
      inset:0;
      z-index: 0;
      pointer-events:none;

      background: radial-gradient(circle at center,
        rgba(0,0,0,.55) 0%,
        rgba(0,0,0,.78) 50%,
        rgba(0,0,0,.92) 100%
      );

      opacity: 0;
      transition: opacity 220ms ease;
      will-change: opacity;
    }

    /* Normal open */
    #lightbox.show::before{ opacity: 1; }

    /* Closing: fade overlay out immediately */
    #lightbox.closing::before{
  opacity: 0;
  transition-duration: 140ms; /* ✅ faster close fade */
}

    #lightboxInner{
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #lightboxFrame{
      width: min(1120px, calc(100vw - 40px));
      aspect-ratio: 16 / 9;
      max-height: min(90vh, calc(100vh - 110px));
      height: auto;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    #lightboxImg{
      width: 100%;
      height: 100%;
      object-fit: contain;

      border-radius: var(--thumb-radius);
      border: 1px solid rgba(255,255,255,.10);
      background: #09090b;

      opacity: 0;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      transition:
  opacity 220ms ease,
  transform 520ms cubic-bezier(.16,1,.3,1); /* ✅ smoother open */

      will-change: transform, opacity;
    }

    /* When shown and ready */
    #lightbox.show #lightboxImg:not(.is-loading){
      opacity: 1;
    }

    /* Hide real center image until FLIP finishes */
    #lightboxImg.is-loading{
      opacity: 0 !important;
    }

    /* Close button */
    #lightboxClose{
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10000;
      transition: opacity 160ms ease, transform 160ms ease;
      will-change: opacity, transform;
    }

    /* Close button fades out during closing */
    #lightbox.closing #lightboxClose{
      opacity: 0;
      transform: translateY(-6px) scale(.98);
      pointer-events: none;
    }

    /* FLIP clone (flies in/out) */
    /* FLIP clone (flies in/out) */
#lbClone{
  position: fixed;

  <script>
  // =========================
  // ✅ Magnetic Micro-interactions
  // =========================
  (() => {
    const threshold = 40;
    const power = 0.04;
    document.addEventListener("pointermove", (e) => {
      const items = document.querySelectorAll(".btn-glow:not(.no-magnetic)");
      items.forEach(el => {
        const r = el.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < threshold) {
          const moveX = dx * power;
          const moveY = dy * power;
          el.style.transform = `translate3d(${moveX}px, ${moveY}px, 0) scale(1.002)`;
        } else {
          el.style.transform = "";
        }
      });
    }, { passive: true });
  })();

  // =========================
  // ✅ Perf: delegated glow (1 listener + rAF)
  // =========================
  (() => {
    let activeEl = null;
    let raf = 0;
    let lastEvent = null;

    function update() {
      raf = 0;
      if (!activeEl || !lastEvent) return;
      const r = activeEl.getBoundingClientRect();
      const x = ((lastEvent.clientX - r.left) / r.width) * 100;
      const y = ((lastEvent.clientY - r.top) / r.height) * 100;
      activeEl.style.setProperty("--mx", x + "%");
      activeEl.style.setProperty("--my", y + "%");
    }

    document.addEventListener(
      "pointerover",
      (e) => {
        const el = e.target.closest?.(".btn-glow");
        if (!el) return;
        activeEl = el;
      },
      { passive: true }
    );

    document.addEventListener(
      "pointerout",
      (e) => {
        const el = e.target.closest?.(".btn-glow");
        if (!el) return;
        if (activeEl === el) {
          el.style.setProperty("--mx", "50%");
          el.style.setProperty("--my", "50%");
          activeEl = null;
          lastEvent = null;
        }
      },
      { passive: true }
    );

    document.addEventListener(
      "pointermove",
      (e) => {
        if (!activeEl) return;
        lastEvent = e;
        if (!raf) raf = requestAnimationFrame(update);
      },
      { passive: true }
    );
  })();

  // ===== Mobile menu (same behavior as index) =====
  const menuBtn = document.getElementById("menuBtn");
  const mobileMenu = document.getElementById("mobileMenu");
  if (menuBtn && mobileMenu) {

    mobileMenu.querySelectorAll("a").forEach((a) =>

  // ===== Anchor offset var (for consistency) =====
  function setHeaderOffset() {

    if (!header) return;
    document.documentElement.style.setProperty("--header-h", header.offsetHeight + "px");
  }
  window.addEventListener("load", setHeaderOffset, { passive: true });
  window.addEventListener("resize", setHeaderOffset, { passive: true });

  // =========================

  const revealObserver = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("reveal-in");
          revealObserver.unobserve(entry.target);
        }
      });
    },
    { threshold: 0.12, rootMargin: "0px 0px -10% 0px" }
  );

  function observeExistingReveals() {
    document.querySelectorAll(".reveal-inner, .reveal-line").forEach((el) => revealObserver.observe(el));
  }

  // =========================

  // =========================
  // ✅ Cards + render (with reveal like index)
  // =========================
  function cardTemplate(item, index, flowDelay = 0) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "thumb-card text-left focus:outline-none";
    btn.setAttribute("aria-label", `Open thumbnail (${item.category})`);

    // ✅ reveal wrapper (same concept as index)
    const inner = document.createElement("div");
    inner.className = "reveal-inner no-blur";
    // Perceptual "Flow" stagger (35ms * column position)
    inner.style.setProperty("--reveal-delay", `${flowDelay}ms`);

    const img = document.createElement("img");
    img.src = item.src;
    img.alt = "Thumbnail";
    img.className = "thumb-img";
    img.loading = "lazy";
    img.decoding = "async";

    // Smooth load fade
    img.onload = () => img.classList.add("is-loaded");
    if (img.complete) img.classList.add("is-loaded");

    const overlay = document.createElement("div");
    overlay.className = "thumb-overlay";

    const pill = document.createElement("div");
    pill.className = "thumb-pill";
    pill.textContent = item.category;

    inner.appendChild(img);
    inner.appendChild(overlay);
    inner.appendChild(pill);
    btn.appendChild(inner);

    // ✅ PERSISTENCE SYNC: Hide if this card is already "open" (even if grid was re-rendered)
    if (lastSrc === item.src) {
      btn.classList.add("is-opening");
      lastThumbEl = btn;
      lastThumbImg = img;
    }

    btn.addEventListener("click", () => openLightbox(item.src, btn));
    btn.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openLightbox(item.src, btn);
      }
    });

    // observe reveal for this card
    revealObserver.observe(inner);

    return btn;
  }

  function render(filter = "ALL") {
    if (!grid) return;
    grid.innerHTML = "";

    const filtered = filter === "ALL" ? items : items.filter((i) => i.category === filter);
    
    // Calculate current column count for row-by-row (bar-by-bar) reveal
    let cols = 3;
    if (window.innerWidth <= 640) cols = 1;
    else if (window.innerWidth <= 900) cols = 2;

    const frag = document.createDocumentFragment();
    filtered.forEach((item, idx) => {
      const colIndex = idx % cols;
      const flowDelay = colIndex * 35; // 35ms tiny offset for "liquid" feel
      frag.appendChild(cardTemplate(item, idx, flowDelay));
    });
    grid.appendChild(frag);
  }

  // =========================
  // ✅ Filter indicator
  // =========================
  function moveIndicatorTo(btn) {
    if (!indicator) return;
    indicator.style.width = btn.offsetWidth + "px";
    indicator.style.height = btn.offsetHeight + "px";
    indicator.style.transform = `translate(${btn.offsetLeft}px, ${btn.offsetTop}px)`;
  }

  function setActiveFilterBtn(btn) {
    filterBtns.forEach((b) => b.classList.remove("text-white"));
    btn.classList.add("text-white");
    moveIndicatorTo(btn);
  }

  // =========================
  // ✅ Init
  // =========================
  window.addEventListener("load", () => {
    observeExistingReveals();

    const allBtn = filterBtns.find((b) => b.dataset.filter === "ALL") || filterBtns[0];
    if (allBtn) setActiveFilterBtn(allBtn);
    render("ALL");

    window.addEventListener(
      "resize",
      () => {
        const active = document.querySelector(".filterBtn.text-white") || allBtn;
        if (active) moveIndicatorTo(active);
      },
      { passive: true }
    );
  });

  filterBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      setActiveFilterBtn(btn);
      render(btn.dataset.filter);
    });
  });
</script>
</main>
</body>
</html>
