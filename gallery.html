body { padding-right: var(--sbw, 0px); }

    #filtersWrap, #grid, #grid * { overflow-anchor: none; }

    body{

      color: #f4f4f5;
    }
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .10;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 2px, transparent 4px),

    }

    /* btn-glow (same behavior as index) */
    .btn-glow{
      --mx: 50%;
      --my: 50%;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      transform: translateZ(0);
    }
    .btn-glow::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius: inherit;
      pointer-events:none;
      z-index: 0;
      background:
        radial-gradient(120px 80px at var(--mx) var(--my),
          rgba(203, 184, 255, 0.075),
          rgba(56, 8, 228, 0.032) 45%,
          transparent 72%);
      opacity: 0;
      transition: opacity .16s ease;
    }
    .btn-glow::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius: inherit;
      pointer-events:none;
      z-index:0;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.10) inset,
        0 14px 50px rgba(56,8,228,.12);
      opacity: 0;
      transition: opacity .16s ease;
    }
    .btn-glow:hover::before,
    .btn-glow:hover::after{ opacity: 1; }
    .btn-glow > *{ position: relative; z-index: 1; }

    .lets-create-edge{
      border: 1.5px solid rgba(56,8,228,.85) !important;

    /* Thumbnails — EXACT old hover feel */
.thumb-card{
  position: relative;
  overflow: hidden;
  border-radius: 16px; /* old: rounded-2xl (roughly 16px) */
  background: #18181b; /* bg-zinc-900 */
  text-align: left;

  transform: translateZ(0);
  transition: transform 300ms ease-out, border-color 300ms ease-out, box-shadow 300ms ease-out;
  will-change: transform;
  -webkit-tap-highlight-color: transparent;
}

.thumb-card:hover{
  transform: translateY(-4px) scale(1.035);
}

.thumb-card:active{
  transform: translateY(0px) scale(1.01);   /* active:scale-[1.01] */
}

/* Image — match old (no hover zoom) */
.thumb-img{
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: #09090b;
  transform: none;
  transition: none;
}

/* Overlay — match old (opacity 0 -> 1, 300ms) */
.thumb-overlay{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition: opacity 300ms;
  background: linear-gradient(to top,
    rgba(0,0,0,.70),
    rgba(0,0,0,0) 60%
  );
}

.thumb-card:hover .thumb-overlay{ opacity: 0.6; }

    /* =========================
       Scroll Reveal (same as index)
       ========================= */
    .reveal-inner{
      opacity: 0;
      transform: translateY(var(--reveal-y, 18px)) scale(0.985);
      transition:
        opacity 680ms cubic-bezier(.16,1,.3,1),
        transform 680ms cubic-bezier(.16,1,.3,1);
      transition-delay: var(--reveal-delay, 0ms);
      will-change: transform, opacity;
    }
    .reveal-in{
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    @media (prefers-reduced-motion: reduce){
      .reveal-inner{ transition: none; opacity: 1; transform: none; }
    }

    /* Remove blur ONLY for thumbnails */
    .no-blur { filter: none !important; }
    .no-blur.reveal-in { filter: none !important; }

    /* =========================
       ✅ LIGHTBOX + FLY (matches index)
       ========================= */
    #lightbox{
      position: fixed;
      inset: 0;
      z-index: 9999;

      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
      will-change: opacity;

      isolation: isolate;
    }

    /* Show state */
    #lightbox.show{
      opacity: 1;
      pointer-events: auto;
    }

    /* Overlay base */
    #lightbox::before{
      content:"";
      position:absolute;
      inset:0;
      z-index: 0;
      pointer-events:none;

      background: radial-gradient(circle at center,
        rgba(0,0,0,.55) 0%,
        rgba(0,0,0,.78) 50%,
        rgba(0,0,0,.92) 100%
      );

      opacity: 0;
      transition: opacity 220ms ease;
      will-change: opacity;
    }

    /* Normal open */
    #lightbox.show::before{ opacity: 1; }

    /* Closing: fade overlay out immediately */
    #lightbox.closing::before{
  opacity: 0;
  transition-duration: 140ms; /* ✅ faster close fade */
}

    #lightboxInner{
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #lightboxFrame{
      width: min(1120px, calc(100vw - 40px));
      aspect-ratio: 16 / 9;
      max-height: min(90vh, calc(100vh - 110px));
      height: auto;

      display:flex;
      align-items:center;
      justify-content:center;

      height: 100%;

      background: rgba(9,9,11,.85);

      opacity: 0;
      transform: scale(.985) translateY(6px);

  opacity 220ms ease,

    /* When shown and ready */

      transform: scale(1) translateY(0);
    }

    /* Hide real center image until FLIP finishes */
    #lightboxImg.is-loading{
      opacity: 0 !important;
      transform: scale(.985) translateY(6px) !important;
    }

    /* Close button */
    #lightboxClose{
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10000;

      will-change: opacity, transform;
    }

    /* Close button fades out during closing */
    #lightbox.closing #lightboxClose{
      opacity: 0;
      transform: translateY(-6px) scale(.98);
      pointer-events: none;
    }

  <script>
  // =========================
  // ✅ Perf: delegated glow (1 listener + rAF)
  // =========================
  (() => {
    let activeEl = null;
    let raf = 0;
    let lastEvent = null;

    function update() {
      raf = 0;
      if (!activeEl || !lastEvent) return;
      const r = activeEl.getBoundingClientRect();
      const x = ((lastEvent.clientX - r.left) / r.width) * 100;
      const y = ((lastEvent.clientY - r.top) / r.height) * 100;
      activeEl.style.setProperty("--mx", x + "%");
      activeEl.style.setProperty("--my", y + "%");
    }

    document.addEventListener(
      "pointerover",
      (e) => {
        const el = e.target.closest?.(".btn-glow");
        if (!el) return;
        activeEl = el;
      },
      { passive: true }
    );

    document.addEventListener(
      "pointerout",
      (e) => {
        const el = e.target.closest?.(".btn-glow");
        if (!el) return;
        if (activeEl === el) {
          el.style.setProperty("--mx", "50%");
          el.style.setProperty("--my", "50%");
          activeEl = null;
          lastEvent = null;
        }
      },
      { passive: true }
    );

    document.addEventListener(
      "pointermove",
      (e) => {
        if (!activeEl) return;
        lastEvent = e;
        if (!raf) raf = requestAnimationFrame(update);
      },
      { passive: true }
    );
  })();

  // ===== Mobile menu (same behavior as index) =====

  window.addEventListener("load", setHeaderOffset, { passive: true });

  const revealObserver = new IntersectionObserver(

          revealObserver.unobserve(entry.target);
        }
      });
    },

  function observeExistingReveals() {

  // ✅ Motion tuning
const OPEN_MS = 620;
const OPEN_EASE = "cubic-bezier(.16,1,.3,1)";
const OPEN_FADE_MS = 220;

const CLOSE_MS = 320;
const CLOSE_EASE = "cubic-bezier(.4,0,.2,1)";
const CLOSE_FADE_MS = 120;

  function getRadiusPx(el, fallback = "18px") {
    try {
      const r = getComputedStyle(el).borderRadius;
      return r && r !== "0px" ? r : fallback;
    } catch {
      return fallback;
    }
  }

  let __sbw = 0;

// =========================
// ✅ Scroll lock with ZERO layout change (no nudge)
// =========================
let __scrollLockOn = false;

const __lockEvents = {
  wheel: (e) => { if (__scrollLockOn) e.preventDefault(); },
  touchmove: (e) => { if (__scrollLockOn) e.preventDefault(); },
  keydown: (e) => {
    if (!__scrollLockOn) return;
    // block scroll keys while lightbox open
    const keys = ["ArrowUp","ArrowDown","PageUp","PageDown","Home","End"," "];
    if (keys.includes(e.key)) e.preventDefault();
  }
};

function lockBodyScroll() {
  if (__scrollLockOn) return;
  __scrollLockOn = true;

  // prevent scrolling without changing layout
  window.addEventListener("wheel", __lockEvents.wheel, { passive: false });
  window.addEventListener("touchmove", __lockEvents.touchmove, { passive: false });
  window.addEventListener("keydown", __lockEvents.keydown, { passive: false });

  // optional: stop iOS "rubber band" behind overlay
  document.documentElement.style.overscrollBehavior = "none";
}

function unlockBodyScroll() {
  if (!__scrollLockOn) return;
  __scrollLockOn = false;

  window.removeEventListener("wheel", __lockEvents.wheel, { passive: false });
  window.removeEventListener("touchmove", __lockEvents.touchmove, { passive: false });
  window.removeEventListener("keydown", __lockEvents.keydown, { passive: false });

  document.documentElement.style.overscrollBehavior = "";
}

  function preloadImage(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = src;
    });
  }

  function showLightboxImageInstant(src) {
    if (!lightboxImg) return;
    lightboxImg.style.transition = "none";
    lightboxImg.src = src;
    lightboxImg.classList.remove("is-loading");
    lightboxImg.getBoundingClientRect();
    requestAnimationFrame(() => {
      lightboxImg.style.transition = "";
    });
  }

  async function openLightbox(src, fromEl) {
    if (lbBusy) return;
    lbBusy = true;

    lastSrc = src;
    lastThumbEl = fromEl || null;
    lastThumbImg = fromEl?.querySelector("img") || null;
    fromEl?.classList.add("is-opening");

    if (!lightbox || !lightboxImg) {
      fromEl?.classList.remove("is-opening");
      lbBusy = false;
      return;
    }

    // show overlay immediately (fade in)
    lightbox.classList.remove("hidden");
    lightbox.classList.remove("closing");
    lightbox.classList.add("show");
    lockBodyScroll();

    // hide real center image until FLIP ends
    lightboxImg.classList.add("is-loading");
    lightboxImg.src = "";

    const thumbImg = lastThumbImg;

    // If no thumb/frame, fallback to normal fade in
    if (!thumbImg || !lightboxFrame) {
      const ok = await preloadImage(src);
      lightboxImg.src = src;
      try {
        await lightboxImg.decode();
      } catch {}
      lightboxImg.classList.remove("is-loading");
      fromEl?.classList.remove("is-opening");
      lbBusy = false;
      if (!ok) console.warn("Lightbox image failed to load:", src);
      return;
    }

    // Ensure thumb decoded (best effort)
    try {
      await thumbImg.decode?.();
    } catch {}

    // Preload full before ending FLIP
    const full = new Image();
    full.src = src;
    try {
      await full.decode();
    } catch {}

    // Measure start/end
    const start = thumbImg.getBoundingClientRect();
    const end = lightboxFrame.getBoundingClientRect();

    // Create clone starting at END rect, but transformed back to start (FLIP)
    const clone = document.createElement("img");
    clone.id = "lbClone";
    clone.src = thumbImg.currentSrc || thumbImg.src;

    // ✅ prevents “square” flash
    clone.style.borderRadius = getRadiusPx(fromEl, "18px");
    clone.style.overflow = "hidden";

    clone.style.left = Math.round(end.left) + "px";
    clone.style.top = Math.round(end.top) + "px";
    clone.style.width = Math.round(end.width) + "px";
    clone.style.height = Math.round(end.height) + "px";

    const dx = Math.round(start.left - end.left);
    const dy = Math.round(start.top - end.top);
    const sx = start.width / end.width;
    const sy = start.height / end.height;

    clone.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
    clone.style.opacity = "1";

    document.body.appendChild(clone);

    // animate to identity
    clone.getBoundingClientRect();
requestAnimationFrame(() => {
  clone.classList.add("settle");
  clone.style.transition =
    `transform ${OPEN_MS}ms ${OPEN_EASE}, opacity ${OPEN_FADE_MS}ms ease`;
  clone.style.transform = "translate(0px, 0px) scale(1, 1)";
});

    let done = false;
    const finish = () => {
      if (done) return;
      done = true;

      showLightboxImageInstant(src);
      requestAnimationFrame(() => clone.remove());

      fromEl?.classList.remove("is-opening");
      lbBusy = false;
    };

    clone.addEventListener("transitionend", (e) => {
      if (e.propertyName !== "transform") return;
      finish();
    });

    setTimeout(finish, OPEN_MS + 60);
  }

  function closeLightbox() {
    if (!lightbox || !lightboxImg || lbBusy) return;
    lbBusy = true;

    document.getElementById("lbClone")?.remove();

    // Fallback if no thumb/frame: just fade
    if (!lastThumbImg || !lightboxFrame) {
      lightbox.classList.add("closing");
      lightbox.classList.remove("show");

      setTimeout(() => {
        lightboxImg.src = "";
        lightbox.classList.remove("closing");
        lightbox.classList.add("hidden");
        unlockBodyScroll();
        lbBusy = false;
      }, 140);

      return;
    }

    // Measure while visible
    const start = lightboxFrame.getBoundingClientRect();
    const end = lastThumbImg.getBoundingClientRect();

    // Start closing UI (keep scroll locked until end)
    lightbox.classList.add("closing");
    lightbox.classList.remove("show");

    // Create clone at center rect
    const clone = document.createElement("img");
    clone.id = "lbClone";
    clone.src = lightboxImg.currentSrc || lightboxImg.src || lastSrc || lastThumbImg.src;

    // ✅ keep rounded during close too
    clone.style.borderRadius = getRadiusPx(lastThumbEl, "18px");
    clone.style.overflow = "hidden";

    clone.style.left = Math.round(start.left) + "px";
    clone.style.top = Math.round(start.top) + "px";
    clone.style.width = Math.round(start.width) + "px";
    clone.style.height = Math.round(start.height) + "px";
    clone.style.transform = "translate(0px, 0px) scale(1, 1)";
    clone.style.opacity = "1";

    document.body.appendChild(clone);

    // Hide real center image immediately
    lightboxImg.classList.add("is-loading");

    // Animate back to thumb
    const dx = Math.round(end.left - start.left);
    const dy = Math.round(end.top - start.top);
    const sx = +(end.width / start.width).toFixed(4);
    const sy = +(end.height / start.height).toFixed(4);

    clone.getBoundingClientRect();
requestAnimationFrame(() => {
  clone.style.transition =
    `transform ${CLOSE_MS}ms ${CLOSE_EASE}, opacity ${CLOSE_FADE_MS}ms ease`;
  clone.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
  clone.style.opacity = "0.96";
});

    let done = false;
    const finish = () => {
      if (done) return;
      done = true;

      clone.remove();
      lightboxImg.src = "";
      lightbox.classList.remove("closing");
      lightbox.classList.add("hidden");
      lastThumbEl?.classList.remove("is-opening");

      unlockBodyScroll();
      lbBusy = false;
    };

    clone.addEventListener("transitionend", (e) => {
      if (e.propertyName !== "transform") return;
      finish();
    });

    setTimeout(finish, CLOSE_MS + 60);
  }

  lightboxClose?.addEventListener("click", closeLightbox);

  lightbox?.addEventListener("click", (e) => {
    const inner = document.getElementById("lightboxInner");
    if (e.target === lightbox || e.target === inner) closeLightbox();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeLightbox();
  });

  // =========================
  // ✅ Cards + render (with reveal like index)
  // =========================
  function cardTemplate(item, index) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "thumb-card text-left focus:outline-none";
    btn.setAttribute("aria-label", `Open thumbnail (${item.category})`);

    // ✅ reveal wrapper (same concept as index)
    const inner = document.createElement("div");
    inner.className = "reveal-inner no-blur";
    inner.style.setProperty("--reveal-delay", `${Math.min(index * 35, 260)}ms`);

    const img = document.createElement("img");
    img.src = item.src;
    img.alt = "Thumbnail";
    img.className = "thumb-img";
    img.loading = "lazy";
    img.decoding = "async";

    const overlay = document.createElement("div");
    overlay.className = "thumb-overlay";

    const pill = document.createElement("div");
    pill.className = "thumb-pill";
    pill.textContent = item.category;

    inner.appendChild(img);
    btn.appendChild(inner);
    btn.appendChild(overlay);
    btn.appendChild(pill);

    btn.addEventListener("click", () => openLightbox(item.src, btn));
    btn.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openLightbox(item.src, btn);
      }
    });

    // observe reveal for this card
    revealObserver.observe(inner);

    return btn;
  }

  function render(filter = "ALL") {
    if (!grid) return;
    grid.innerHTML = "";

    const filtered = filter === "ALL" ? items : items.filter((i) => i.category === filter);
    const frag = document.createDocumentFragment();
    filtered.forEach((item, idx) => frag.appendChild(cardTemplate(item, idx)));
    grid.appendChild(frag);
  }

  // =========================
  // ✅ Filter indicator
  // =========================
  function moveIndicatorTo(btn) {
    if (!indicator) return;
    indicator.style.width = btn.offsetWidth + "px";
    indicator.style.height = btn.offsetHeight + "px";
    indicator.style.transform = `translate(${btn.offsetLeft}px, ${btn.offsetTop}px)`;
  }

  function setActiveFilterBtn(btn) {
    filterBtns.forEach((b) => b.classList.remove("text-white"));
    btn.classList.add("text-white");
    moveIndicatorTo(btn);
  }

  // =========================
  // ✅ Init
  // =========================
  window.addEventListener("load", () => {
    observeExistingReveals();

    const allBtn = filterBtns.find((b) => b.dataset.filter === "ALL") || filterBtns[0];
    if (allBtn) setActiveFilterBtn(allBtn);
    render("ALL");

    window.addEventListener(
      "resize",
      () => {
        const active = document.querySelector(".filterBtn.text-white") || allBtn;
        if (active) moveIndicatorTo(active);
      },
      { passive: true }
    );
  });

  filterBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      setActiveFilterBtn(btn);
      render(btn.dataset.filter);
    });
  });
</script>
</body>
</html>
